services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.local-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.local-cors.headers.accesscontrolallowheaders=*
      - traefik.http.middlewares.local-cors.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.local-cors.headers.addvaryheader=true
    networks:
      - edge
      - backend

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  kafka-topics-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    command: ["sh", "/kafka/create-topics.sh"]
    volumes:
      - ./docker/kafka/create-topics.sh:/kafka/create-topics.sh:ro
    networks:
      - backend

  minio:
    build:
      context: ./docker/minio
    image: teremok-minio:local
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teremok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-teremok-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
      - object-storage-access

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: teremok_admin
      POSTGRES_PASSWORD: teremok_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/ensure-databases.sh:/database/ensure-databases.sh:ro
      - ./docker/postgres/reset-databases.sh:/database/reset-databases.sh:ro
      - ./backend/auth-service/src/main/resources/schema.sql:/database/auth-schema.sql:ro
      - ./backend/catalog-service/src/main/resources/schema.sql:/database/catalog-schema.sql:ro
      - ./backend/draft-recordings-service/src/main/resources/schema.sql:/database/draft-recordings-schema.sql:ro
      - ./backend/recordings-service/src/main/resources/schema.sql:/database/recordings-schema.sql:ro
      - ./backend/text-work-content-service/src/main/resources/schema.sql:/database/text-work-content-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teremok_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
      - database-access

  db-init:
    image: postgres:17-alpine
    environment:
      DATABASE_HOST: postgres
      POSTGRES_USER: teremok_admin
      POSTGRES_PASSWORD: teremok_admin
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/database/ensure-databases.sh"]
    volumes:
      - ./docker/postgres/ensure-databases.sh:/database/ensure-databases.sh:ro
      - ./backend/auth-service/src/main/resources/schema.sql:/database/auth-schema.sql:ro
      - ./backend/catalog-service/src/main/resources/schema.sql:/database/catalog-schema.sql:ro
      - ./backend/draft-recordings-service/src/main/resources/schema.sql:/database/draft-recordings-schema.sql:ro
      - ./backend/recordings-service/src/main/resources/schema.sql:/database/recordings-schema.sql:ro
      - ./backend/text-work-content-service/src/main/resources/schema.sql:/database/text-work-content-schema.sql:ro
    networks:
      - backend

  db-reset:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      DATABASE_HOST: postgres
      POSTGRES_USER: teremok_admin
      POSTGRES_PASSWORD: teremok_admin
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/database/reset-databases.sh"]
    volumes:
      - ./docker/postgres/ensure-databases.sh:/database/ensure-databases.sh:ro
      - ./docker/postgres/reset-databases.sh:/database/reset-databases.sh:ro
      - ./backend/auth-service/src/main/resources/schema.sql:/database/auth-schema.sql:ro
      - ./backend/catalog-service/src/main/resources/schema.sql:/database/catalog-schema.sql:ro
      - ./backend/draft-recordings-service/src/main/resources/schema.sql:/database/draft-recordings-schema.sql:ro
      - ./backend/recordings-service/src/main/resources/schema.sql:/database/recordings-schema.sql:ro
      - ./backend/text-work-content-service/src/main/resources/schema.sql:/database/text-work-content-schema.sql:ro
    networks:
      - backend

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    image: teremok-auth-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_db
      DATABASE_USERNAME: auth_service
      DATABASE_PASSWORD: auth_service
      JWT_SECRET: local-development-jwt-secret-change-before-production
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=teremok-backend
      - traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.middlewares=local-cors@docker
      - traefik.http.services.auth.loadbalancer.server.port=8080
    networks:
      - backend

  catalog-service:
    build:
      context: .
      dockerfile: backend/catalog-service/Dockerfile
    image: teremok-catalog-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_db
      DATABASE_USERNAME: catalog_service
      DATABASE_PASSWORD: catalog_service
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=teremok-backend
      - traefik.http.routers.catalog.rule=PathPrefix(`/api/v1/catalog`)
      - traefik.http.routers.catalog.entrypoints=web
      - traefik.http.routers.catalog.middlewares=local-cors@docker
      - traefik.http.services.catalog.loadbalancer.server.port=8080
    networks:
      - backend

  draft-recordings-service:
    build:
      context: .
      dockerfile: backend/draft-recordings-service/Dockerfile
    image: teremok-draft-recordings-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/draft_recordings_db
      DATABASE_USERNAME: draft_recordings_service
      DATABASE_PASSWORD: draft_recordings_service
      JWT_SECRET: local-development-jwt-secret-change-before-production
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-teremok}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-teremok-secret}
      S3_BUCKET: teremok-audio
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=teremok-backend
      - traefik.http.routers.draft-recordings.rule=PathPrefix(`/api/v1/draft-recordings`)
      - traefik.http.routers.draft-recordings.entrypoints=web
      - traefik.http.routers.draft-recordings.middlewares=local-cors@docker
      - traefik.http.services.draft-recordings.loadbalancer.server.port=8080
    networks:
      - backend

  recordings-service:
    build:
      context: .
      dockerfile: backend/recordings-service/Dockerfile
    image: teremok-recordings-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/recordings_db
      DATABASE_USERNAME: recordings_service
      DATABASE_PASSWORD: recordings_service
      JWT_SECRET: local-development-jwt-secret-change-before-production
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=teremok-backend
      - traefik.http.routers.recordings.rule=PathPrefix(`/api/v1/recordings`)
      - traefik.http.routers.recordings.entrypoints=web
      - traefik.http.routers.recordings.middlewares=local-cors@docker
      - traefik.http.services.recordings.loadbalancer.server.port=8080
    networks:
      - backend

  renderer-service:
    build:
      context: .
      dockerfile: backend/renderer-service/Dockerfile
    image: teremok-renderer-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-teremok}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-teremok-secret}
      S3_BUCKET: teremok-audio
      FFMPEG_PATH: ffmpeg
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  text-work-content-service:
    build:
      context: .
      dockerfile: backend/text-work-content-service/Dockerfile
    image: teremok-text-work-content-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/text_work_content_db
      DATABASE_USERNAME: text_work_content_service
      DATABASE_PASSWORD: text_work_content_service
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=teremok-backend
      - traefik.http.routers.text-work-content.rule=PathPrefix(`/api/v1/text-work-content`)
      - traefik.http.routers.text-work-content.entrypoints=web
      - traefik.http.routers.text-work-content.middlewares=local-cors@docker
      - traefik.http.services.text-work-content.loadbalancer.server.port=8080
    networks:
      - backend

  text-work-deployer:
    build:
      context: .
      dockerfile: backend/text-work-deployer/Dockerfile
    image: teremok-text-work-deployer:local
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - ./examples:/examples:ro
    networks:
      - backend

  database-exporter:
    build:
      context: .
      dockerfile: backend/database-exporter/Dockerfile
    image: teremok-database-exporter:local
    profiles: ["tools"]
    environment:
      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DATABASE_USERNAME: auth_service
      AUTH_DATABASE_PASSWORD: auth_service
      DRAFT_DATABASE_URL: jdbc:postgresql://postgres:5432/draft_recordings_db
      DRAFT_DATABASE_USERNAME: draft_recordings_service
      DRAFT_DATABASE_PASSWORD: draft_recordings_service
      RECORDINGS_DATABASE_URL: jdbc:postgresql://postgres:5432/recordings_db
      RECORDINGS_DATABASE_USERNAME: recordings_service
      RECORDINGS_DATABASE_PASSWORD: recordings_service
      CATALOG_DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DATABASE_USERNAME: catalog_service
      CATALOG_DATABASE_PASSWORD: catalog_service
      CONTENT_DATABASE_URL: jdbc:postgresql://postgres:5432/text_work_content_db
      CONTENT_DATABASE_USERNAME: text_work_content_service
      CONTENT_DATABASE_PASSWORD: text_work_content_service
      EXPORT_PATH: /exports/teremok-database-export.xlsx
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./exports:/exports
    networks:
      - backend

networks:
  edge:
    name: teremok-edge
  backend:
    name: teremok-backend
    internal: true
  database-access:
    name: teremok-database-access
  object-storage-access:
    name: teremok-object-storage-access

volumes:
  kafka-data:
  minio-data:
  postgres-data:
