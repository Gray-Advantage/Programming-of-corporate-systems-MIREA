spring:
  application:
    name: recordings-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/recordings_db}
    username: ${DATABASE_USERNAME:recordings_service}
    password: ${DATABASE_PASSWORD:recordings_service}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "spring.json.add.type.headers": false
    listener:
      missing-topics-fatal: true

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-before-production}

management:
  endpoints:
    web:
      exposure:
        include: health
