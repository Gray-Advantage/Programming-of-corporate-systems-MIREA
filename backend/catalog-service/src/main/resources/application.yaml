spring:
  application:
    name: catalog-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/catalog_db}
    username: ${DATABASE_USERNAME:catalog_service}
    password: ${DATABASE_PASSWORD:catalog_service}
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "spring.json.add.type.headers": false
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "spring.json.value.default.type": space.grayt.teremok.events.TextWorkAddedEvent
        "spring.json.trusted.packages": space.grayt.teremok.events
        "spring.json.use.type.headers": false
    listener:
      missing-topics-fatal: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    urls:
      - name: Библиотека
        url: /v3/api-docs
      - name: Авторизация и пользователи
        url: /api/v1/auth/openapi
      - name: Черновики записей
        url: /api/v1/draft-recordings/openapi
      - name: Публикации и сборки
        url: /api/v1/recordings/openapi
      - name: Содержимое произведений
        url: /api/v1/text-work-content/openapi
      - name: Статистика и Excel
        url: /api/v1/export/openapi
